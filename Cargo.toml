[workspace]
members = [
    "crates/advice-damage-origins",
    "crates/advice-detectors",
    "crates/advice-model",
    "crates/advice-stats",
    "crates/advice-report",
    "crates/analysis-context",
    "crates/attack-info-vision",
    "crates/frame-meter",
    "crates/hud-vision",
    "crates/input-vision",
    "crates/match-event-layer",
    "crates/meter-tracker",
    "crates/pixel-color",
    "crates/spatial-refine",
    "crates/temporal-confirm",
    "crates/video-analyzer",
    "crates/wasm-bridge",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

# 変異検査用。生成物を実行するのは検査プロセスだけなので、デバッグ情報も
# 逆アセンブルのしやすさも要らない。1 変異ごとに再ビルドする以上、
# ビルドとリンクの速さがそのまま全体の所要時間になる。
[profile.mutants]
inherits = "dev"
debug = false
strip = "debuginfo"
