[workspace]
members = [
    "crates/analysis-context",
    "crates/attack-info-vision",
    "crates/frame-meter",
    "crates/hud-vision",
    "crates/input-vision",
    "crates/match-event-layer",
    "crates/meter-tracker",
    "crates/pixel-color",
    "crates/temporal-confirm",
    "crates/video-analyzer",
    "crates/wasm-bridge",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
