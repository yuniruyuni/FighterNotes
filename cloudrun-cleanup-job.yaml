apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: fighter-cleanup
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/container-dependencies: '{"cleanup":["db-tunnel"]}'
    spec:
      template:
        spec:
          serviceAccountName: fighter-cleanup@yuniruyuni-net.iam.gserviceaccount.com
          maxRetries: 2
          timeoutSeconds: 600
          containers:
            - name: cleanup
              image: IMAGE_PLACEHOLDER
              command:
                - /app/server
              args:
                - --batch=cleanup
              env:
                - name: DB_APP_NAME
                  value: fighter
                - name: PGUSER
                  value: fighter_app
                - name: CLEANUP_BATCH_SIZE
                  value: "500"
                - name: CLEANUP_MAX_BATCHES
                  value: "1000"
                - name: SHARE_RETENTION_DAYS
                  value: "30"
                - name: PGPOOL_MAX
                  value: "1"
                - name: PG_CONNECTION_TIMEOUT_MS
                  value: "5000"
                - name: PG_IDLE_TIMEOUT_MS
                  value: "30000"
                - name: PG_STATEMENT_TIMEOUT_MS
                  value: "30000"
                - name: PG_LOCK_TIMEOUT_MS
                  value: "5000"
                - name: PG_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS
                  value: "30000"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: fighter-db-app-password
              resources:
                limits:
                  cpu: "1"
                  memory: "256Mi"
            - name: db-tunnel
              image: cloudflare/cloudflared:latest
              args:
                - access
                - tcp
                - --hostname
                - db.yuniruyuni.net
                - --url
                - 0.0.0.0:5432
              env:
                - name: TUNNEL_SERVICE_TOKEN_ID
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: fighter-cleanup-cf-db-access-client-id
                - name: TUNNEL_SERVICE_TOKEN_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: fighter-cleanup-cf-db-access-client-secret
              resources:
                limits:
                  cpu: "0.5"
                  memory: "256Mi"
              startupProbe:
                tcpSocket:
                  port: 5432
                periodSeconds: 1
                timeoutSeconds: 1
                failureThreshold: 30
