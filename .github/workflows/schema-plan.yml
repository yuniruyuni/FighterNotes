name: Schema Plan

on:
  pull_request: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Detect schema-impacting changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          schema_changed=false
          while IFS= read -r -d '' path; do
            case "$path" in
              schema/*|.pgschemaignore|Dockerfile.migration|bin/migrate.sh)
                printf 'Schema-impacting path: %s\n' "$path"
                schema_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA")
          printf 'schema_changed=%s\n' "$schema_changed" >> "$GITHUB_OUTPUT"

      - name: No schema changes
        if: steps.changes.outputs.schema_changed != 'true'
        run: echo "No schema-impacting changes; schema plan is a successful no-op."

      - name: Build migration toolchain
        if: steps.changes.outputs.schema_changed == 'true'
        run: docker build -f Dockerfile.migration -t fighter-schema-plan .

      - name: Start PostgreSQL
        if: steps.changes.outputs.schema_changed == 'true'
        run: |
          docker run --detach --rm \
            --name fighter-schema-plan-postgres \
            --publish 5432:5432 \
            --env POSTGRES_USER=planuser \
            --env POSTGRES_PASSWORD=planpass \
            --env POSTGRES_DB=plandb \
            postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a

          for attempt in {1..30}; do
            if docker exec fighter-schema-plan-postgres \
              pg_isready --username planuser --dbname plandb; then
              exit 0
            fi
            echo "Waiting for PostgreSQL (${attempt}/30)..."
            sleep 2
          done

          docker logs fighter-schema-plan-postgres
          exit 1

      - name: Prepare application role
        if: steps.changes.outputs.schema_changed == 'true'
        env:
          PGPASSWORD: planpass
        run: |
          docker run --rm --network host \
            --env PGPASSWORD \
            postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a \
            psql \
            --host localhost \
            --username planuser \
            --dbname plandb \
            --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE fighter_app NOLOGIN"

      - name: Apply base branch schema (current state)
        if: steps.changes.outputs.schema_changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git show "${BASE_SHA}:schema/main.sql" > /dev/null 2>&1; then
            mkdir -p /tmp/main_schema
            git archive "$BASE_SHA" -- schema/ .pgschemaignore | tar -x -C /tmp/main_schema
            docker run --rm --network host \
              --entrypoint pgschema \
              --workdir /work \
              -v /tmp/main_schema/schema:/work/schema:ro \
              -v /tmp/main_schema/.pgschemaignore:/work/.pgschemaignore:ro \
              fighter-schema-plan apply \
              --file /work/schema/main.sql \
              --host localhost --port 5432 \
              --user planuser --password planpass --db plandb \
              --schema public --auto-approve --no-color --lock-timeout 30s
            echo "Applied PR base branch schema as baseline."
          else
            echo "No schema/main.sql on the PR base branch — planning against empty DB (initial migration)."
          fi

      - name: Plan PR schema changes (diff from base)
        if: steps.changes.outputs.schema_changed == 'true'
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set +e
          docker run --rm --network host \
            --entrypoint pgschema \
            --workdir /work \
            -v "${WORKSPACE}/schema:/work/schema:ro" \
            -v "${WORKSPACE}/.pgschemaignore:/work/.pgschemaignore:ro" \
            fighter-schema-plan plan \
            --file /work/schema/main.sql \
            --host localhost --port 5432 \
            --user planuser --password planpass --db plandb \
            --schema public --no-color \
            > plan_output.txt 2>&1
          PLAN_EXIT_CODE=$?
          set -e
          printf '%s\n' "$PLAN_EXIT_CODE" > plan_exit_code.txt

      - name: Comment plan on PR
        if: always() && steps.changes.outputs.schema_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PLAN=$(cat plan_output.txt)
          ALERT=""
          if echo "$PLAN" | grep -qiE "DROP|GRANT|REVOKE|PRIVILEGES"; then
            ALERT="> [!CAUTION]
          > This migration includes destructive or privilege-related changes.
          > Please review carefully before merging.

          "
          fi
          BODY="<!-- fighter-pgschema-plan -->
          ## pgschema plan
          ${ALERT}\`\`\`sql
          ${PLAN}
          \`\`\`"

          COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- fighter-pgschema-plan -->")) | .id' \
            | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi

      - name: Enforce successful schema plan
        if: always() && steps.changes.outputs.schema_changed == 'true'
        run: |
          if [ ! -f plan_output.txt ]; then
            echo "pgschema plan did not produce plan_output.txt" >&2
            exit 1
          fi
          if [ ! -f plan_exit_code.txt ]; then
            echo "pgschema plan did not record an exit code" >&2
            exit 1
          fi

          PLAN_EXIT_CODE=$(cat plan_exit_code.txt)
          case "$PLAN_EXIT_CODE" in
            0)
              echo "pgschema plan completed successfully."
              ;;
            *[!0-9]*|'')
              echo "pgschema plan recorded an invalid exit code: $PLAN_EXIT_CODE" >&2
              exit 1
              ;;
            *)
              echo "pgschema plan failed with exit code $PLAN_EXIT_CODE" >&2
              exit 1
              ;;
          esac

      - name: Stop PostgreSQL
        if: always() && steps.changes.outputs.schema_changed == 'true'
        run: docker rm --force fighter-schema-plan-postgres 2> /dev/null || true
