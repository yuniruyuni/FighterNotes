name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: fighter_test
          POSTGRES_PASSWORD: fighter_test
          POSTGRES_DB: fighter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fighter_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fighter_test:fighter_test@localhost:5432/fighter_test
      # cache key と install 引数の両方から参照し、版とcacheがずれないようにする。
      WASM_PACK_VERSION: 0.15.0
      CARGO_ABOUT_VERSION: 0.9.1

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # clippyとtestとwasm buildは同じ依存を何度もコンパイルし直す。
      # cacheはmainでだけ保存する。PRで作ったcacheはそのPRからしか見えず、
      # 他のPRが再利用できないまま容量を食う。
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # cargo installしたbinaryは専用cacheで持ち回すので二重に持たない。
          cache-bin: false

      # 2つのcargo installはソースからのビルドで毎回3分かかる。版が同じなら
      # 同じbinaryなので、mutest-rsと同じように成果物ごと持ち回す。
      - name: Restore Rust CLI tools
        id: rust-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/bin/cargo-about
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-wasm-pack-${{ env.WASM_PACK_VERSION }}-cargo-about-${{ env.CARGO_ABOUT_VERSION }}

      - name: Install wasm-pack
        if: steps.rust-tools.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Install cargo-about
        if: steps.rust-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --features cli

      - name: Setup Bun
        run: npm install -g bun@1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release workflow contracts
        run: bun test scripts/release-workflows.test.ts

      - name: Run Rust checks
        run: bun run check:rust

      - name: Verify third-party notices
        run: bun run check:licenses

      - name: Build project
        env:
          FIGHTER_NOTES_BUILD_SHA: ${{ github.sha }}
        run: bun run build

      - name: Check WASM API contract
        run: bun run check:wasm-api

      - name: Run type check
        run: bun run check:type

      - name: Run linter
        run: bun run check:lint

      - name: Run tests
        run: bun run check:test

      - name: Run root script tests
        run: bun run check:scripts

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Bun
        run: npm install -g bun@1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit

  # test の後ろに置くと、image buildの2分40秒がそのままCI全体の待ち時間に乗る。
  # 並列にすると、testが落ちたときのbuild 1回分を無駄に払う代わりに、
  # 成功時のCIがtestとbuildの長い方だけで終わる。
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # layer cacheはreleaseのbuildと同じscopeを使う。CIが先に同じcommitを
      # buildするので、後から走るreleaseはそのlayerを読むだけで済む。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: fighter
          build-args: FIGHTER_NOTES_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=fighter
          cache-to: type=gha,mode=max,scope=fighter

      - name: Build migration image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.migration
          load: true
          tags: fighter-migration
          cache-from: type=gha,scope=fighter-migration
          cache-to: type=gha,mode=max,scope=fighter-migration

      - name: Test Docker image
        run: |
          docker run --rm -d -p 3000:3000 --name test-container fighter
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker stop test-container
