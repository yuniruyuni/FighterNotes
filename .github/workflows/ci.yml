# main への push のときだけ、test / security / docker の成功後に
# deploy (deploy-yunirun.yml) を呼ぶ。定期の依存監査は security.yml が受け持つ。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_USER: fighter_test
          POSTGRES_PASSWORD: fighter_test
          POSTGRES_DB: fighter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fighter_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fighter_test:fighter_test@localhost:5432/fighter_test
      # cache key と install 引数の両方から参照し、版とcacheがずれないようにする。
      WASM_PACK_VERSION: 0.15.0
      CARGO_ABOUT_VERSION: 0.9.1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # clippyとtestとwasm buildは同じ依存を何度もコンパイルし直す。
      # cacheはmainでだけ保存する。PRで作ったcacheはそのPRからしか見えず、
      # 他のPRが再利用できないまま容量を食う。
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # cargo installしたbinaryは専用cacheで持ち回すので二重に持たない。
          cache-bin: false

      # 2つのcargo installはソースからのビルドで毎回3分かかる。版が同じなら
      # 同じbinaryなので、mutest-rsと同じように成果物ごと持ち回す。
      - name: Restore Rust CLI tools
        id: rust-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/bin/cargo-about
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-wasm-pack-${{ env.WASM_PACK_VERSION }}-cargo-about-${{ env.CARGO_ABOUT_VERSION }}

      - name: Install wasm-pack
        if: steps.rust-tools.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Install cargo-about
        if: steps.rust-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --features cli

      - name: Setup Bun
        run: npm install -g bun@1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release workflow contracts
        run: bun test scripts/release-workflows.test.ts

      # 認識の shader は GPU が無いと走らせられない。lavapipe (ソフトウェアの
      # Vulkan 実装) を入れて、参照実装との突き合わせを CI でも回す。
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Run Rust checks
        run: bun run check:rust

      # 通知そのものは commit せず、次の build が生成する。ここでは書き出さずに
      # license policy (許可リスト外・本文欠落・override の不整合) だけを検査する。
      - name: Check third-party license policy
        run: bun run check:licenses

      - name: Build project
        env:
          FIGHTER_NOTES_BUILD_SHA: ${{ github.sha }}
        run: bun run build

      - name: Check WASM API contract
        run: bun run check:wasm-api

      - name: Run type check
        run: bun run check:type

      - name: Run linter
        run: bun run check:lint

      - name: Run architecture check
        run: bun run check:arch

      - name: Run tests
        run: bun run check:test

      - name: Run root script tests
        run: bun run check:scripts

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        run: npm install -g bun@1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit

  # test の後ろに置くと、image buildの2分40秒がそのままCI全体の待ち時間に乗る。
  # 並列にすると、testが落ちたときのbuild 1回分を無駄に払う代わりに、
  # 成功時のCIがtestとbuildの長い方だけで終わる。
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # layer cacheはreleaseのbuildと同じscopeを使う。CIが先に同じcommitを
      # buildするので、後から走るreleaseはそのlayerを読むだけで済む。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fighter
          build-args: FIGHTER_NOTES_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=fighter
          cache-to: type=gha,mode=max,scope=fighter

      - name: Build migration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.migration
          load: true
          tags: fighter-migration
          cache-from: type=gha,scope=fighter-migration
          cache-to: type=gha,mode=max,scope=fighter-migration

      - name: Test Docker image
        run: |
          docker run --rm -d -p 3000:3000 --name test-container fighter
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker stop test-container

  deploy:
    # test / security / docker がすべて成功した main への push だけ。
    # OIDC の sub は ref:refs/heads/main になり、VPS 側の認可と一致する。
    needs: [test, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-yunirun.yml
    # 呼ばれる側の job が使う権限の上限。再利用ワークフローは呼び出し側より
    # 多い権限を持てないので、足りないと startup_failure になる。
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit
