name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: fighter_test
          POSTGRES_PASSWORD: fighter_test
          POSTGRES_DB: fighter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fighter_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fighter_test:fighter_test@localhost:5432/fighter_test

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Setup Bun
        run: npm install -g bun@1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release workflow contracts
        run: bun test scripts/release-workflows.test.ts

      - name: Run Rust checks
        run: bun run check:rust

      - name: Verify third-party notices
        run: bun run check:licenses

      - name: Build project
        env:
          FIGHTER_NOTES_BUILD_SHA: ${{ github.sha }}
        run: bun run build

      - name: Check WASM API contract
        run: bun run check:wasm-api

      - name: Run type check
        run: bun run check:type

      - name: Run linter
        run: bun run check:lint

      - name: Run tests
        run: bun run check:test

      - name: Run root script tests
        run: bun run check:scripts

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Bun
        run: npm install -g bun@1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit

  docker:
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build Docker image
        run: docker build --build-arg "FIGHTER_NOTES_BUILD_SHA=${GITHUB_SHA}" -t fighter .

      - name: Build migration image
        run: docker build -f Dockerfile.migration -t fighter-migration .

      - name: Test Docker image
        run: |
          docker run --rm -d -p 3000:3000 --name test-container fighter
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker stop test-container
