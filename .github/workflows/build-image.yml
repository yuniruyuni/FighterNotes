name: Build and Push Image

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      image_name:
        required: true
        type: string
      build_args:
        required: false
        type: string
        default: ""
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_BUILDER_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_BUILDER_SERVICE_ACCOUNT:
        required: true
    outputs:
      artifact_image_ref:
        description: Artifact Registry image pinned to the pushed digest
        value: ${{ jobs.build.outputs.artifact_image_ref }}
      artifact_image_digest:
        description: Digest returned by Artifact Registry
        value: ${{ jobs.build.outputs.artifact_image_digest }}

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_image_ref: ${{ steps.push-artifact.outputs.image_ref }}
      artifact_image_digest: ${{ steps.push-artifact.outputs.digest }}
    env:
      GCP_REGION: us-west1
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REPO_OWNER: ${{ github.repository_owner }}
      IMAGE_NAME: ${{ inputs.image_name }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      # `${{ ... }}` を run: の中に直接展開すると shell injection 可能になるため、
      # env で先に変数として受けて run の中では `$BUILD_ARGS` で参照する。
      BUILD_ARGS: ${{ inputs.build_args }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}

      - name: Validate immutable build inputs
        run: |
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "source_sha must be a full commit SHA" >&2
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9A-Za-z._-]+$'; then
            echo "image_tag contains unsupported characters" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_BUILDER_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_BUILDER_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        # `build_args` は改行区切りの "KEY=VALUE" 列。空なら追加引数なし。
        # `$BUILD_ARGS` は env 経由で渡す。
        run: |
          BUILD_ARG_FLAGS=""
          if [ -n "$BUILD_ARGS" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              BUILD_ARG_FLAGS="$BUILD_ARG_FLAGS --build-arg $line"
            done <<< "$BUILD_ARGS"
          fi
          docker build $BUILD_ARG_FLAGS -f "$DOCKERFILE" -t "${IMAGE_NAME}:${TAG}" .

      - name: Push to Artifact Registry
        id: push-artifact
        run: |
          IMAGE_REPOSITORY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/fighter/${IMAGE_NAME}"
          IMAGE_TAG="${IMAGE_REPOSITORY}:${TAG}"
          docker tag "${IMAGE_NAME}:${TAG}" "$IMAGE_TAG"
          docker push "$IMAGE_TAG" | tee "$RUNNER_TEMP/artifact-push.txt"

          DIGEST=$(sed -nE \
            's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' \
            "$RUNNER_TEMP/artifact-push.txt" | tail -1)
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Artifact Registry did not return an image digest" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Push to GHCR (archive)
        run: |
          GHCR_TAG="ghcr.io/${REPO_OWNER}/${IMAGE_NAME}:${TAG}"
          docker tag "${IMAGE_NAME}:${TAG}" "$GHCR_TAG"
          docker push "$GHCR_TAG"

      - name: Record immutable image
        env:
          ARTIFACT_IMAGE_REF: ${{ steps.push-artifact.outputs.image_ref }}
        run: |
          {
            echo "### ${IMAGE_NAME} image"
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Artifact Registry: \`$ARTIFACT_IMAGE_REF\`"
            echo "- GHCR archive tag: \`ghcr.io/${REPO_OWNER}/${IMAGE_NAME}:${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
