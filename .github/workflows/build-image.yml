name: Build and Push Image

on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      image_name:
        required: true
        type: string
      build_args:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GCP_REGION: us-west1
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REPO_OWNER: ${{ github.repository_owner }}
      IMAGE_NAME: ${{ inputs.image_name }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      # `${{ ... }}` を run: の中に直接展開すると shell injection 可能になるため、
      # env で先に変数として受けて run の中では `$BUILD_ARGS` で参照する。
      BUILD_ARGS: ${{ inputs.build_args }}
      TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_BUILDER_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_BUILDER_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        # `build_args` は改行区切りの "KEY=VALUE" 列。空なら追加引数なし。
        # `$BUILD_ARGS` は env 経由で渡す。
        run: |
          BUILD_ARG_FLAGS=""
          if [ -n "$BUILD_ARGS" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              BUILD_ARG_FLAGS="$BUILD_ARG_FLAGS --build-arg $line"
            done <<< "$BUILD_ARGS"
          fi
          docker build $BUILD_ARG_FLAGS -f "$DOCKERFILE" -t "${IMAGE_NAME}:${TAG}" .

      - name: Push to Artifact Registry
        run: |
          IMAGE_TAG="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/fighter/${IMAGE_NAME}:${TAG}"
          docker tag "${IMAGE_NAME}:${TAG}" "$IMAGE_TAG"
          docker push "$IMAGE_TAG"

      - name: Push to GHCR (archive)
        run: |
          GHCR_TAG="ghcr.io/${REPO_OWNER}/${IMAGE_NAME}:${TAG}"
          docker tag "${IMAGE_NAME}:${TAG}" "$GHCR_TAG"
          docker push "$GHCR_TAG"
