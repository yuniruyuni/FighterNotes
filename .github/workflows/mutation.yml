name: Mutation testing

on:
  pull_request:
    paths:
      - .cargo/mutants.toml
      - .github/workflows/mutation.yml
      - Cargo.lock
      - Cargo.toml
      - bun.lock
      - client/src/**
      - crates/**
      - package.json
      - scripts/check-stryker-results.*
      - server/src/models/**
      - server/src/repositories/**
      - stryker.*.config.mjs
  schedule:
    - cron: "17 18 * * 6"
  workflow_dispatch:
    inputs:
      full_rust:
        description: Run the sharded full Rust mutation inventory
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.11
  CARGO_MUTANTS_VERSION: 27.0.0

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Mutate client domain and application code
        run: bun run mutation:ts:client
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-client
          path: reports/mutation/client.*
          if-no-files-found: ignore

  server-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Mutate server models
        run: bun run mutation:ts:server-models
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-server-models
          path: reports/mutation/server-models.*
          if-no-files-found: ignore

  server-repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: fighter_test
          POSTGRES_PASSWORD: fighter_test
          POSTGRES_DB: fighter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fighter_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fighter_test:fighter_test@localhost:5432/fighter_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Mutate PostgreSQL repositories
        run: bun run mutation:ts:server-repositories
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-server-repositories
          path: reports/mutation/server-repositories.*
          if-no-files-found: ignore

  # pull request では、その変更が touch した行だけを mutate する。
  # workspace 全体は 1,500 mutant を超え、PR ごとに回すには桁が合わない
  # （45分では temporal の途中までしか進まなかった）。全量の走査は週次の
  # rust-full-inventory が担当し、ここは「新しく書いた Rust に検査が
  # 付いているか」だけを短時間で見る。
  rust-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}
      # 対象の列挙は package.json の script が正本なので、cargo を直接
      # 呼ばずに済むよう Bun だけ用意する（node_modules は使わない）。
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      - name: Collect the changed Rust lines
        run: |
          git diff --no-color \
            "origin/${{ github.base_ref }}...HEAD" \
            -- '*.rs' > mutants.diff
          wc -l mutants.diff
      - name: Mutate the changed Rust lines
        run: bun run mutation:rust:changed
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-rust-changed
          path: mutants.out-changed/mutants.out/
          if-no-files-found: ignore

  # 全域を crate ごとに回す。以前は workspace を 4 分割していたが、どの
  # crate が落ちたのかが分からず、直せた crate から必須へ上げていくことも
  # できなかった。
  #
  # `tolerated: false` は missed を 0 にし終えた crate。以後は落ちたら
  # ジョブも落ちる。残りは inventory として回し、0 にできた順に
  # `tolerated: false` へ移す。
  rust-full:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_rust)
    continue-on-error: ${{ matrix.tolerated }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: pixel-color
            tolerated: false
          - crate: analysis-context
            tolerated: true
          - crate: frame-meter
            tolerated: true
          - crate: meter-tracker
            tolerated: true
          - crate: hud-vision
            tolerated: true
          - crate: input-vision
            tolerated: true
          - crate: attack-info-vision
            tolerated: true
          - crate: temporal-confirm
            tolerated: true
          - crate: match-event-layer
            tolerated: true
          - crate: advice-report
            tolerated: true
          - crate: spatial-refine
            tolerated: true
          - crate: video-analyzer
            tolerated: true
          - crate: wasm-bridge
            tolerated: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}
      - name: Mutate ${{ matrix.crate }}
        run: >-
          cargo mutants --jobs 2
          --package '${{ matrix.crate }}'
          --output 'mutants.out-${{ matrix.crate }}'
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-rust-${{ matrix.crate }}
          path: mutants.out-${{ matrix.crate }}/mutants.out/
          if-no-files-found: ignore
