name: Mutation testing

on:
  pull_request:
    paths:
      - .cargo/mutants.toml
      - .github/workflows/mutation.yml
      - Cargo.lock
      - Cargo.toml
      - bun.lock
      - client/src/**
      - crates/**
      - package.json
      - scripts/check-stryker-results.*
      - server/src/models/**
      - server/src/repositories/**
      - stryker.*.config.mjs
  # main でも回して cache を温める。PR ブランチで作った cache は
  # その PR からしか見えず、他の PR が再利用できない。
  push:
    branches: [main]
    paths:
      - .cargo/mutants.toml
      - .github/workflows/mutation.yml
      - Cargo.lock
      - Cargo.toml
      - bun.lock
      - client/src/**
      - crates/**
      - package.json
      - scripts/check-stryker-results.*
      - server/src/models/**
      - server/src/repositories/**
      - stryker.*.config.mjs
  schedule:
    - cron: "17 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.11
  CARGO_MUTANTS_VERSION: 27.0.0

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Mutate client domain and application code
        run: bun run mutation:ts:client
      # 作業場所が狭すぎないかを実測で確かめ続ける。溢れかけていれば
      # ここで気付ける。
      - name: Report the scratch usage
        if: always()
        run: df -h "$MUTANTS_SCRATCH" | tail -1

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-client
          path: reports/mutation/client.*
          if-no-files-found: ignore

  server-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Mutate server models
        run: bun run mutation:ts:server-models
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-server-models
          path: reports/mutation/server-models.*
          if-no-files-found: ignore

  server-repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: fighter_test
          POSTGRES_PASSWORD: fighter_test
          POSTGRES_DB: fighter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fighter_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fighter_test:fighter_test@localhost:5432/fighter_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Mutate PostgreSQL repositories
        run: bun run mutation:ts:server-repositories
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-server-repositories
          path: reports/mutation/server-repositories.*
          if-no-files-found: ignore

  # その変更が touch した行だけを mutate する。全域は下の rust-clean /
  # rust-pending が回すが、まだ missed を 0 にできていない crate は
  # 落ちない扱いなので、そこへ入った変更を捕まえるのはこのジョブになる。
  rust-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # 変異ジョブは同じ依存を使う。既定はジョブ名がキーに入るため、
          # シャードごとに別 cache になって全て miss していた。
          shared-key: mutants
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}
      # 対象の列挙は package.json の script が正本なので、cargo を直接
      # 呼ばずに済むよう Bun だけ用意する（node_modules は使わない）。
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      - name: Collect the changed Rust lines
        run: |
          git diff --no-color \
            "origin/${{ github.base_ref }}...HEAD" \
            -- '*.rs' > mutants.diff
          wc -l mutants.diff
      - name: Mutate the changed Rust lines
        run: bun run mutation:rust:changed
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-rust-changed
          path: mutants.out-changed/mutants.out/
          if-no-files-found: ignore

  # 全域を毎 PR 回す。1 ジョブに収めると 28 分かかるので、実測した
  # crate ごとの費用に比例させて分割する。runner は 4 vCPU なので
  # `--jobs 4` まで使い切る。
  #
  # missed を 0 にし終えた crate は rust-clean へ移し、落ちたらジョブも
  # 落ちる扱いにする。残りは rust-pending で inventory として回す。
  rust-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # 変異ジョブは同じ依存を使う。既定はジョブ名がキーに入るため、
          # シャードごとに別 cache になって全て miss していた。
          shared-key: mutants
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}
      - name: Mutate the crates that are already clean
        run: >-
          cargo mutants --jobs 4 --profile mutants
          --package pixel-color
          --output mutants.out-clean
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-rust-clean
          path: mutants.out-clean/mutants.out/
          if-no-files-found: ignore

  rust-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: match-event-layer-1
            packages: --package match-event-layer
            shard: 0/3
          - name: match-event-layer-2
            packages: --package match-event-layer
            shard: 1/3
          - name: match-event-layer-3
            packages: --package match-event-layer
            shard: 2/3
          - name: hud-vision-1
            packages: --package hud-vision
            shard: 0/2
          - name: hud-vision-2
            packages: --package hud-vision
            shard: 1/2
          - name: input-vision
            packages: --package input-vision
            shard: 0/1
          - name: frame-meter
            packages: --package frame-meter
            shard: 0/1
          - name: advice-detectors
            packages: --package advice-detectors
            shard: 0/1
          - name: spatial-refine
            packages: --package spatial-refine
            shard: 0/1
          - name: match-event-model
            packages: --package match-event-model
            shard: 0/1
          - name: temporal-and-attack-info
            packages: >-
              --package attack-info-vision
              --package temporal-confirm
            shard: 0/1
          - name: advice-stats-and-origins
            packages: >-
              --package advice-damage-origins
              --package advice-stats
            shard: 0/1
          - name: remaining-crates
            packages: >-
              --package advice-model
              --package advice-report
              --package analysis-context
              --package meter-tracker
              --package video-analyzer
              --package wasm-bridge
            shard: 0/1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # 変異ジョブは同じ依存を使う。既定はジョブ名がキーに入るため、
          # シャードごとに別 cache になって全て miss していた。
          shared-key: mutants
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}
      # 変異検査の費用は 95% がビルドで、その大半は中間生成物の書き出し。
      # runner のディスクは種類によって速さが桁で違うので、候補を実測して
      # 一番速いところを作業場所にする。測定結果はログに残す。
      - name: Pick the fastest scratch disk
        run: |
          best="$RUNNER_TEMP"
          best_rate=0
          for dir in "$RUNNER_TEMP" /mnt /dev/shm; do
            probe="$dir/mutants-probe"
            if ! mkdir -p "$probe" 2>/dev/null; then
              sudo mkdir -p "$probe" && sudo chown "$(id -u)" "$probe" || continue
            fi
            rate=$(LC_ALL=C dd if=/dev/zero of="$probe/probe.bin" bs=1M count=256 conv=fdatasync 2>&1 | awk '/copied/ { r = $(NF - 1); u = $NF; if (u ~ /^GB/) r *= 1000; if (u ~ /^kB/) r /= 1000; print r }')
            rate=${rate:-0}
            avail=$(df -BG --output=avail "$dir" | tail -1 | tr -dc '0-9')
            rm -rf "$probe" 2>/dev/null || sudo rm -rf "$probe" || true
            echo "$dir: $rate MB/s (空き ${avail}G)"
            # 4 並列がそれぞれ作業木と target を持つ。実測のピークは
            # 822MB なので数 GB あれば足りるが、溢れるとビルドごと落ちる
            # ため余裕を見て 6GB を下限にする。
            if [ "${avail:-0}" -lt 6 ]; then
              echo "  空きが足りないので候補から外す"
              continue
            fi
            if awk -v a="$rate" -v b="$best_rate" 'BEGIN { exit !(a > b) }'; then
              best="$dir"
              best_rate="$rate"
            fi
          done
          echo "作業場所: $best ($best_rate MB/s)"
          if ! mkdir -p "$best/mutants" 2>/dev/null; then
            sudo mkdir -p "$best/mutants"
            sudo chown "$(id -u):$(id -g)" "$best/mutants"
          fi
          echo "TMPDIR=$best/mutants" >> "$GITHUB_ENV"
          echo "MUTANTS_SCRATCH=$best" >> "$GITHUB_ENV"

      # まだ missed を 0 にできていない crate なので、生存やタイムアウトが
      # あってもジョブは落とさない。件数だけ summary に残し、0 に到達した
      # ものから rust-clean へ移して落ちる扱いにする。
      #
      # 終了コードは見ない。生存とタイムアウトで別のコードが返るうえ、
      # package 名を書き間違えたときは 1 件も検査せず 0 が返る。走査が
      # 最後まで進んだかどうかは、結果ファイルの件数で判断する。
      - name: Mutate ${{ matrix.name }}
        run: |
          set +e
          cargo mutants --jobs 4 --profile mutants \
            ${{ matrix.packages }} \
            --shard '${{ matrix.shard }}' \
            --output 'mutants.out-${{ matrix.name }}'
          set -e
          out='mutants.out-${{ matrix.name }}/mutants.out'
          count() { [ -f "$out/$1.txt" ] && wc -l < "$out/$1.txt" || echo 0; }
          caught=$(count caught); missed=$(count missed)
          timeout=$(count timeout); unviable=$(count unviable)
          {
            echo "### ${{ matrix.name }}"
            echo "caught $caught / missed $missed / timeout $timeout / unviable $unviable"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$((caught + missed + timeout + unviable))" -eq 0 ]; then
            echo "no mutants were tested; check the package names" >&2
            exit 1
          fi
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-rust-${{ matrix.name }}
          path: mutants.out-${{ matrix.name }}/mutants.out/
          if-no-files-found: ignore
