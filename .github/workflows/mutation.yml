name: Mutation testing

on:
  pull_request:
    paths:
      - scripts/run-mutest.*
      - .github/workflows/mutation.yml
      - Cargo.lock
      - Cargo.toml
      - bun.lock
      - client/src/**
      - crates/**
      - package.json
      - scripts/check-stryker-results.*
      - server/src/models/**
      - server/src/repositories/**
      - stryker.*.config.mjs
  # main でも回して cache を温める。PR ブランチで作った cache は
  # その PR からしか見えず、他の PR が再利用できない。
  push:
    branches: [main]
    paths:
      - scripts/run-mutest.*
      - .github/workflows/mutation.yml
      - Cargo.lock
      - Cargo.toml
      - bun.lock
      - client/src/**
      - crates/**
      - package.json
      - scripts/check-stryker-results.*
      - server/src/models/**
      - server/src/repositories/**
      - stryker.*.config.mjs
  schedule:
    - cron: "17 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.11
  # mutest-rs は crates.io に無いので git から入れる。研究段階のツールで
  # 破壊的な変更が入りうるため、追跡する版を固定する。
  MUTEST_REF: "a55cb8abc50dcbc1687abf5d6c49efa737c9880a"

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Mutate client domain and application code
        run: bun run mutation:ts:client
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-client
          path: reports/mutation/client.*
          if-no-files-found: ignore

  server-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Mutate server models
        run: bun run mutation:ts:server-models
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-server-models
          path: reports/mutation/server-models.*
          if-no-files-found: ignore

  server-repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: fighter_test
          POSTGRES_PASSWORD: fighter_test
          POSTGRES_DB: fighter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fighter_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fighter_test:fighter_test@localhost:5432/fighter_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Mutate PostgreSQL repositories
        run: bun run mutation:ts:server-repositories
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-server-repositories
          path: reports/mutation/server-repositories.*
          if-no-files-found: ignore

  # Rust の変異検査。全 crate を毎回、漏れなく回す。
  #
  # 以前は cargo-mutants を使っていた。変異ごとに増分ビルドするため費用の
  # 95% がビルドで、14 シャードに分けても 13 分かかっていた。分けるほど
  # ビルドが重複するので、並列度を上げても頭打ちだった。
  #
  # mutest-rs は実行時に切り替わる形へ一度だけ変換する。ビルドが重複しない
  # ので、シャードに分けた分だけ素直に短くなる。
  #
  # 標本抽出も種類の間引きもしない。走るたびに対象が変わると結果が揺れ、
  # 門番として信用できなくなる。全域を常に全部回すのが条件になる。
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # mutest の自動 timeout は無変異時の実行時間に最低 1 秒だけ足す。
    # 4 並列の隔離 process を共有 runner で動かすと、CPU 待ちだけでこの
    # 余裕を超えて正常な変異が時間切れになるため、1 core 分を空ける。
    # 1 は mutest の timeout 監視が使えないので、安定する最小値の 2 にする。
    env:
      RUST_TEST_THREADS: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          # 手元の実測秒で均した組。最大が全体の所要時間になる。
          - name: "1"
            crates: frame-meter
          - name: "2"
            crates: advice-report match-event-defense match-event-layer
          - name: "3"
            crates: >-
              advice-model advice-stats analysis-context hud-vision video-analyzer
          - name: "4"
            crates: >-
              advice-damage-origins meter-tracker pixel-color temporal-confirm
          - name: "5"
            crates: attack-info-vision input-vision match-event-model
          - name: "6"
            crates: >-
              advice-detectors match-event-offense spatial-refine wasm-bridge
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # mutest はコンパイラ内部 API を使うため、固定の nightly が要る。
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1
        with:
          toolchain: nightly-2026-07-18
          components: rustc-dev, llvm-tools
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: mutest
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Setup Bun
        run: npm install -g bun@${BUN_VERSION}
      # mutest 自体のビルドに 80 秒かかる。追跡している版と toolchain が
      # 変わらない限り結果は同じなので、成果物ごと持ち回す。driver は
      # runtime の場所をビルド時に焼き込むが、MUTEST_SEARCH_PATH で
      # 上書きできるので、置き場所は固定しておけばよい。
      - name: Restore mutest-rs
        id: mutest-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/mutest-driver
            ~/.cargo/bin/cargo-mutest
            ~/mutest-artifacts
          key: mutest-${{ env.MUTEST_REF }}-nightly-2026-07-18
      - name: Install mutest-rs
        if: steps.mutest-cache.outputs.cache-hit != 'true'
        run: |
          src="$RUNNER_TEMP/mutest-rs"
          mkdir -p "$src"
          cd "$src"
          git init -q
          git remote add origin https://github.com/zalanlevai/mutest-rs
          git fetch -q --depth 1 origin "$MUTEST_REF"
          git checkout -q FETCH_HEAD
          cargo build --release -p mutest-runtime
          cargo install --force --path mutest-driver
          cargo install --force --path cargo-mutest
          mkdir -p ~/mutest-artifacts
          cp -r target/release/. ~/mutest-artifacts/
      - name: Mutate shard ${{ matrix.name }}
        run: |
          export MUTEST_SEARCH_PATH="$HOME/mutest-artifacts"
          bun scripts/run-mutest.ts ${{ matrix.crates }}
