name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - name: Bind release to the successful CI revision
        id: release
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "CI workflow did not provide a full source SHA" >&2
            exit 1
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  build-app:
    needs: release-gate
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      source_sha: ${{ needs.release-gate.outputs.source_sha }}
      image_tag: ${{ needs.release-gate.outputs.image_tag }}
      dockerfile: Dockerfile
      image_name: fighter
      build_args: FIGHTER_NOTES_BUILD_SHA=${{ needs.release-gate.outputs.source_sha }}
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_BUILDER_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_BUILDER_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_BUILDER_SERVICE_ACCOUNT: ${{ secrets.GCP_BUILDER_SERVICE_ACCOUNT }}

  build-migration:
    needs: release-gate
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      source_sha: ${{ needs.release-gate.outputs.source_sha }}
      image_tag: ${{ needs.release-gate.outputs.image_tag }}
      dockerfile: Dockerfile.migration
      image_name: fighter-migration
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_BUILDER_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_BUILDER_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_BUILDER_SERVICE_ACCOUNT: ${{ secrets.GCP_BUILDER_SERVICE_ACCOUNT }}

  release:
    needs: [release-gate, build-app, build-migration]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: fighter-production-release
      cancel-in-progress: false
    env:
      GCP_REGION: us-west1
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SERVICE_NAME: fighter
      SOURCE_SHA: ${{ needs.release-gate.outputs.source_sha }}
      APP_IMAGE_NAME: fighter
      APP_IMAGE_DIGEST: ${{ needs.build-app.outputs.artifact_image_digest }}
      MIGRATION_IMAGE_NAME: fighter-migration
      MIGRATION_IMAGE_DIGEST: ${{ needs.build-migration.outputs.artifact_image_digest }}
      # Cloudflare Access の client_id は CF-Access-Client-Id ヘッダで送る識別子で、
      # 認証には client_secret が要る。Secret Manager は active version 数で課金
      # されるため client_id はここから埋め込む (workload 毎の分離は secret 側で維持)。
      CF_RUNTIME_CLIENT_ID: ${{ secrets.CF_DB_ACCESS_CLIENT_ID_RUNTIME }}
      CF_MIGRATION_CLIENT_ID: ${{ secrets.CF_DB_ACCESS_CLIENT_ID_MIGRATION }}
      CF_CLEANUP_CLIENT_ID: ${{ secrets.CF_DB_ACCESS_CLIENT_ID_CLEANUP }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-gate.outputs.source_sha }}
          fetch-depth: 1

      - name: Skip a release superseded before migration
        id: current-main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          if [ "$SOURCE_SHA" = "$CURRENT_MAIN_SHA" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing current main revision $SOURCE_SHA."
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded revision $SOURCE_SHA; current main is $CURRENT_MAIN_SHA."
          fi

      - name: Validate and compose immutable image references
        if: steps.current-main.outputs.should_release == 'true'
        run: |
          validate_digest() {
            local label="$1"
            local digest="$2"
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "$label must be a sha256 image digest" >&2
              exit 1
            fi
          }
          validate_component() {
            local label="$1"
            local value="$2"
            if ! printf '%s' "$value" | grep -Eq '^[a-z0-9][a-z0-9._-]*$'; then
              echo "$label contains unsupported registry path characters" >&2
              exit 1
            fi
          }

          validate_client_id() {
            local label="$1"
            local value="$2"
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{32}\.access$'; then
              echo "$label must be a Cloudflare Access service token client ID" >&2
              exit 1
            fi
          }

          validate_digest "Application image digest" "$APP_IMAGE_DIGEST"
          validate_digest "Migration image digest" "$MIGRATION_IMAGE_DIGEST"
          validate_client_id "Runtime client ID" "$CF_RUNTIME_CLIENT_ID"
          validate_client_id "Migration client ID" "$CF_MIGRATION_CLIENT_ID"
          validate_client_id "Cleanup client ID" "$CF_CLEANUP_CLIENT_ID"
          validate_component "GCP region" "$GCP_REGION"
          validate_component "GCP project ID" "$GCP_PROJECT_ID"
          validate_component "Application image name" "$APP_IMAGE_NAME"
          validate_component "Migration image name" "$MIGRATION_IMAGE_NAME"

          IMAGE_REPOSITORY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/fighter"
          {
            printf 'APP_IMAGE_REF=%s/%s@%s\n' \
              "$IMAGE_REPOSITORY" "$APP_IMAGE_NAME" "$APP_IMAGE_DIGEST"
            printf 'MIGRATION_IMAGE_REF=%s/%s@%s\n' \
              "$IMAGE_REPOSITORY" "$MIGRATION_IMAGE_NAME" "$MIGRATION_IMAGE_DIGEST"
          } >> "$GITHUB_ENV"
          echo "Validated immutable application and migration image digests."

      - name: Authenticate to Google Cloud
        if: steps.current-main.outputs.should_release == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_DEPLOYER_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: steps.current-main.outputs.should_release == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Run migration
        id: migration
        if: steps.current-main.outputs.should_release == 'true'
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$MIGRATION_IMAGE_REF|g" cloudrun-job.yaml
          sed -i "s|CF_MIGRATION_CLIENT_ID_PLACEHOLDER|$CF_MIGRATION_CLIENT_ID|g" cloudrun-job.yaml
          # 置換漏れは cloudflared の認証失敗として実行時にしか現れないのでここで落とす
          if grep -q CF_MIGRATION_CLIENT_ID_PLACEHOLDER cloudrun-job.yaml; then
            echo "CF_MIGRATION_CLIENT_ID_PLACEHOLDER was not substituted" >&2
            exit 1
          fi
          gcloud run jobs replace cloudrun-job.yaml \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"
          gcloud run jobs execute "${SERVICE_NAME}-migration" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --wait

      - name: Install cleanup job
        id: cleanup
        if: steps.current-main.outputs.should_release == 'true'
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$APP_IMAGE_REF|g" cloudrun-cleanup-job.yaml
          sed -i "s|CF_CLEANUP_CLIENT_ID_PLACEHOLDER|$CF_CLEANUP_CLIENT_ID|g" cloudrun-cleanup-job.yaml
          # 置換漏れは cloudflared の認証失敗として実行時にしか現れないのでここで落とす
          if grep -q CF_CLEANUP_CLIENT_ID_PLACEHOLDER cloudrun-cleanup-job.yaml; then
            echo "CF_CLEANUP_CLIENT_ID_PLACEHOLDER was not substituted" >&2
            exit 1
          fi
          gcloud run jobs replace cloudrun-cleanup-job.yaml \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"

      - name: Deploy to Cloud Run
        id: service
        if: steps.current-main.outputs.should_release == 'true'
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$APP_IMAGE_REF|g" cloudrun.yaml
          sed -i "s|CF_RUNTIME_CLIENT_ID_PLACEHOLDER|$CF_RUNTIME_CLIENT_ID|g" cloudrun.yaml
          # 置換漏れは cloudflared の認証失敗として実行時にしか現れないのでここで落とす
          if grep -q CF_RUNTIME_CLIENT_ID_PLACEHOLDER cloudrun.yaml; then
            echo "CF_RUNTIME_CLIENT_ID_PLACEHOLDER was not substituted" >&2
            exit 1
          fi
          gcloud run services replace cloudrun.yaml \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"

      - name: Smoke test deployed service
        id: smoke
        if: steps.current-main.outputs.should_release == 'true'
        run: |
          SMOKE_CURL_OPTIONS=(
            --fail --silent --show-error
            --connect-timeout 5 --max-time 15
            --retry 5 --retry-delay 2 --retry-max-time 90 --retry-all-errors
          )
          curl "${SMOKE_CURL_OPTIONS[@]}" https://fighter.yuniruyuni.net/health
          curl "${SMOKE_CURL_OPTIONS[@]}" https://fighter.yuniruyuni.net/ready

      - name: Record release outcome
        if: always()
        env:
          SHOULD_RELEASE: ${{ steps.current-main.outputs.should_release }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          SERVICE_OUTCOME: ${{ steps.service.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          SIDECAR_IMAGE=$(awk '$1 == "image:" && $2 ~ /^cloudflare\/cloudflared:/ { print $2; exit }' cloudrun.yaml)
          {
            echo "## Production release"
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Application digest: \`$APP_IMAGE_DIGEST\`"
            echo "- Migration digest: \`$MIGRATION_IMAGE_DIGEST\`"
            echo "- DB sidecar: \`${SIDECAR_IMAGE:-unknown}\`"
            echo "- Current-main gate: \`${SHOULD_RELEASE:-unknown}\`"
            echo "- Migration stage: \`${MIGRATION_OUTCOME:-not-run}\`"
            echo "- Cleanup stage: \`${CLEANUP_OUTCOME:-not-run}\`"
            echo "- Service stage: \`${SERVICE_OUTCOME:-not-run}\`"
            echo "- Smoke test: \`${SMOKE_OUTCOME:-not-run}\`"
          } >> "$GITHUB_STEP_SUMMARY"
