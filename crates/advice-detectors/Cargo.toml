[package]
name = "advice-detectors"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# 各検出器を確実に発火させるイベント列。検出器を束ねる上位 crate が、
# 呼び出しの配線まで検査するために使う。
test-support = ["match-event-layer/test-support"]

[dependencies]
advice-model = { path = "../advice-model" }
analysis-context = { path = "../analysis-context" }
attack-info-vision = { path = "../attack-info-vision" }
hud-vision = { path = "../hud-vision" }
match-event-layer = { path = "../match-event-layer" }
serde = { workspace = true }
temporal-confirm = { path = "../temporal-confirm" }

[dev-dependencies]
advice-stats = { path = "../advice-stats" }
match-event-layer = { path = "../match-event-layer", features = ["test-support"] }
