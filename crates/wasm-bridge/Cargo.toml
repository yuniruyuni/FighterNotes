[package]
name = "wasm-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd"]

[dependencies]
frame-meter = { path = "../frame-meter" }
meter-tracker = { path = "../meter-tracker" }
video-analyzer = { path = "../video-analyzer" }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
