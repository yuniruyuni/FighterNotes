# 変異させた crate のテストだけを回す。
#
# 以前は依存 crate も analyzer / WASM の contract test 経由で検査する意図で
# workspace 全体を回していたが、実測ではその追加検査が1件も効いていない。
# 一方で費用は大きく、2千行の crate の1変異ごとに 37,000 行の video-analyzer を
# 再ビルド・再テストしていた。
#
#   frame-meter   792 mutants  18分 -> 2分   missed 47 で集合まで一致
#   meter-tracker 328 mutants   9分 -> 50秒  missed 1 で集合まで一致
#
# crate をまたぐ振る舞いを守りたい場合は、その crate 自身の contract test
# として書く。ここを true へ戻すのは、workspace 全体を回さないと落ちない
# 変異を実際に観測してからにする。
test_workspace = false
# タイムアウトは baseline の実測テスト時間の 4 倍だけで決める。走査が
# 止まらなくなる変異を捕まえるのが目的で、そこへ費やす時間は捨て金になる。
#
# 全 9,309 変異を通したテストの最大は 1.4 秒だったのに、既定の下限 20 秒が
# 効いて 84 件のタイムアウトが 1,759 CPU 秒（全体の 19%）を食っていた。
# baseline は実行するマシンで測るので、倍率だけにしておけば速いマシンでも
# 遅いマシンでも同じ割合の余裕が残る。下限は置かない。
timeout_multiplier = 4.0
minimum_test_timeout = 0
gitignore = true

# Examples are diagnostic programs rather than shipped library behavior.
exclude_globs = ["crates/video-analyzer/examples/**/*.rs"]
