apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: fighter-migration
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/container-dependencies: '{"migration":["db-tunnel"]}'
    spec:
      template:
        spec:
          serviceAccountName: fighter-migration@yuniruyuni-net.iam.gserviceaccount.com
          maxRetries: 1
          timeoutSeconds: 300
          containers:
            - name: migration
              image: IMAGE_PLACEHOLDER
              env:
                - name: DB_USER
                  value: fighter
                - name: DB_NAME
                  value: fighter
                # NOTE: migration job は owner pw (DDL 必要)。-app- サフィックス付きの app user pw は使わない
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: fighter-db-password
              resources:
                limits:
                  cpu: "1"
                  memory: "512Mi"
            - name: db-tunnel
              image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
              args:
                - access
                - tcp
                - --hostname
                - db.yuniruyuni.net
                - --url
                - 0.0.0.0:5432
              env:
                # cloudrun.yaml と同様、client_id は deploy 時に CI から埋め込む。
                - name: TUNNEL_SERVICE_TOKEN_ID
                  value: CF_MIGRATION_CLIENT_ID_PLACEHOLDER
                - name: TUNNEL_SERVICE_TOKEN_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: fighter-migration-cf-db-access-client-secret
              resources:
                limits:
                  cpu: "0.5"
                  memory: "256Mi"
              startupProbe:
                tcpSocket:
                  port: 5432
                periodSeconds: 1
                timeoutSeconds: 1
                failureThreshold: 30
